[package]
name = "teahouse-client"
description = "Teahouse client engine: a local clone of each teahouse, read and written through the commands of docs/CLIENT-API.md."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "teahouse-client"
path = "src/main.rs"

[dependencies]
teahouse-core = { path = "../core" }
# The engine's answers are the JSON of CLIENT-API.md §3; hand-written JSON
# escaping is where bugs hide. Both are the de-facto standard and stable.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine must not run an external git program: it has to compile into
# the Android app as-is (CLIENT-API.md §2 and §7). libgit2 is git's own
# library form, with libssh2 for the relay's ssh; everything vendored
# (OpenSSL too) so every target, Android included, builds the same thing
# without system libraries.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "ssh", "vendored-openssl"] }
# Device keys and commit signatures: ed25519 keys in OpenSSH format and
# SSHSIG signatures, the format `git verify-commit` checks (CLIENT-API §7).
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "getrandom"] }
# Teahouse commands that are not git (invitations, attachments) run over
# the same ssh as git: ssh2 binds the very libssh2 git2 already links.
ssh2 = "0.9"
# `serve`: the development HTTP interface on 127.0.0.1:7377. Small,
# synchronous, no async runtime; not used inside the Tauri app.
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
# libssh2 on Windows defaults to WinCNG, which has no ed25519 (the device
# key's type): build it against the same vendored OpenSSL instead.
libssh2-sys = { version = "0.3", features = ["openssl-on-win32", "vendored-openssl"] }
