# The Teahouse app (CLIENT-API.md §7 step 4): the interface in app/, the
# engine in client/, packaged by Tauri 2 for Windows and Android.
#   web      type-check and build the interface
#   windows  NSIS installer (Teahouse_<version>_x64-setup.exe)
#   android  APK for arm64 phones, signed so it installs directly
#   client-windows  teahouse-client.exe on its own: the engine's command line,
#            including the MCP server an AI member runs (docs/MCP.md)
# Artifacts are attached to each run (Actions → this workflow → Artifacts).
#
# CI minutes are paid for: a pull request only type-checks and builds the
# interface (web); the Windows and Android packages and the engine for
# Windows are built when main changes (they feed the nightly release), or by
# hand (Actions → app → Run workflow).
name: app

on:
  push:
    branches: [main]
    paths: ['app/**', 'client/**', 'core/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'client/**', 'core/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The seed data must keep exporting (the engine's dev-stack uses it)
      - run: npm run export-fixtures

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # vendored OpenSSL (libgit2's ssh) builds with the runner's Perl and needs NASM
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - name: Build installer
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: teahouse-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The engine alone, for Windows: `teahouse-client mcp` is what Claude's
  # desktop app runs to give an AI a seat (docs/MCP.md §3).
  client-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # vendored OpenSSL (libgit2's and libssh2's) builds with Perl and NASM
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build teahouse-client.exe
        run: cargo build --release --locked -p teahouse-client
      - name: Smoke test (device key, MCP over stdio)
        shell: bash
        run: |
          set -eu
          exe=target/release/teahouse-client.exe
          root="$RUNNER_TEMP/teahouse-ai"
          # A device key is made on first use.
          "$exe" --root "$root" key | grep -q '^ssh-ed25519 '
          # An MCP client's first exchange, as Claude's desktop app does it.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"houses","arguments":{}}}' \
            | "$exe" mcp --root "$root" > mcp.out
          cat mcp.out
          [ "$(wc -l < mcp.out)" -eq 3 ]
          grep -q '"serverInfo":{"name":"teahouse"' mcp.out
          grep -q '"name":"redeem"' mcp.out
          ! grep -q '"name":"adopt"' mcp.out
          grep -q '"isError":false' mcp.out
      - uses: actions/upload-artifact@v4
        with:
          name: teahouse-client-windows
          path: target/release/teahouse-client.exe
          if-no-files-found: error

  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); only the NDK and
      # the platform/build tools the build needs are added.
      - name: Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          # vendored OpenSSL's Configure looks for the NDK and its clang here
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      # The Android project is generated from tauri.conf.json on every run
      # (src-tauri/gen/ is not committed); then the icons go into it.
      - name: Android project
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/source.png
      # Our activity (edge to edge: pads the page clear of the status bar,
      # navigation bar, camera cutout and keyboard; bar colours follow the
      # theme) replaces the generated one, and the manifest keeps the activity
      # alive across folding/unfolding so the page is not reloaded.
      - name: Android activity
        run: sh scripts/android-patch.sh
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --ci
      - name: Sign APK
        # Always the project's fixed key (repository secrets
        # ANDROID_KEYSTORE_B64 = base64 of the keystore, ANDROID_KEYSTORE_PASSWORD),
        # the same key app/scripts/build-android.sh uses locally: every build,
        # local or nightly, installs over the one already on a phone, so nobody
        # has to uninstall (and lose the device's own key). No key is ever
        # generated here: without the secrets the job fails, and the certificate
        # is checked against the known fingerprint, so a wrong secret fails too.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # SHA-256 of the fixed key's certificate (apksigner verify --print-certs)
          EXPECTED_CERT: 7b4848838eec36757c71729c215d40aac53f3cb8b6363ab74aae727f089e8294
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n1)
          echo "unsigned: $APK"
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are missing; an APK signed with any other key cannot replace the installed app"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > ci.jks
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ci.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out teahouse-arm64.apk aligned.apk
          rm -f ci.jks
          "$BT/apksigner" verify teahouse-arm64.apk
          CERT=$("$BT/apksigner" verify --print-certs teahouse-arm64.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          echo "certificate SHA-256: $CERT"
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::signed with the wrong key (got $CERT, expected $EXPECTED_CERT)"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: teahouse-android
          path: app/teahouse-arm64.apk
          if-no-files-found: error

  # Every build of main replaces the files of the "nightly" release, so the
  # download links in README.md never change.
  release:
    needs: [web, windows, android, client-windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish to the nightly release
        run: |
          set -eu
          cp dist/teahouse-android/teahouse-arm64.apk teahouse-android-arm64.apk
          cp dist/teahouse-windows/*.exe teahouse-windows-x64-setup.exe
          cp dist/teahouse-client-windows/teahouse-client.exe teahouse-client-windows-x64.exe
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --target "$GITHUB_SHA" \
              --title "最新测试版 · Nightly" --notes "每次 main 更新后自动构建。Built automatically from main." || true  # another run may have just created it
          gh release upload nightly teahouse-android-arm64.apk teahouse-windows-x64-setup.exe \
            teahouse-client-windows-x64.exe --clobber
          # 版本号和代号写在 app/package.json（docs/RELEASING.md 第 3 节）
          pkg=$(gh api "repos/$GITHUB_REPOSITORY/contents/app/package.json?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw')
          release="v$(echo "$pkg" | jq -r '.version' | cut -d. -f1,2) $(echo "$pkg" | jq -r '.codename')"
          gh release edit nightly --title "$release · 最新测试版 · $(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}" \
            --notes "每次 main 更新后自动构建。Built automatically from main at ${GITHUB_SHA::7}."

  # The release bot (打包机): a machine member of the team's own teahouse,
  # seated as a guest with a device key of its own. After every build of main
  # it posts under the notice about installers: done, with the download
  # links, or failed, with the log. A run cancelled by a newer push says
  # nothing (the newer run will). Without the secret the job does nothing.
  #   secrets.TEAHOUSE_BOT_DEVICE   the bot's device key (<root>/device)
  #   vars.TEAHOUSE_BOT_RELAY       teahouse@<relay>
  #   vars.TEAHOUSE_BOT_HOST_KEY    the relay's pinned host key line (<root>/known_hosts)
  #   vars.TEAHOUSE_BOT_HOUSE       the teahouse id
  #   vars.TEAHOUSE_BOT_NOTICE      the notice to answer
  announce:
    needs: [web, windows, android, client-windows, release]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BOT_DEVICE: ${{ secrets.TEAHOUSE_BOT_DEVICE }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUBJECT: ${{ github.event.head_commit.message }}
    steps:
      - name: What to say
        id: say
        run: |
          set -eu
          if [ -z "$BOT_DEVICE" ]; then echo "no bot key"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          failed=$(echo "$RESULTS" | jq -r 'to_entries | map(select(.value.result == "failure")) | map(.key) | join("、")')
          release=$(echo "$RESULTS" | jq -r '.release.result')
          subject=$(printf '%s\n' "$SUBJECT" | head -n1)
          if [ -n "$failed" ]; then
            text="这次没打成（${GITHUB_SHA::7}：${subject}）。出错的步骤：${failed}。日志：${RUN_URL}"
          elif [ "$release" = success ]; then
            dl="https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly"
            text="打包好了：${GITHUB_SHA::7}（${subject}）。安卓：${dl}/teahouse-android-arm64.apk ；Windows：${dl}/teahouse-windows-x64-setup.exe 。直接覆盖安装，不要卸载。"
          else
            echo "release: $release, nothing failed: a newer run will speak"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$text"
          { echo "text<<EOT"; printf '%s\n' "$text"; echo "EOT"; } >> "$GITHUB_OUTPUT"
      - if: steps.say.outputs.skip != '1'
        uses: actions/checkout@v5
      - if: steps.say.outputs.skip != '1'
        name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - if: steps.say.outputs.skip != '1'
        uses: Swatinem/rust-cache@v2
      - if: steps.say.outputs.skip != '1'
        name: Build teahouse-client
        run: cargo build --release --locked -p teahouse-client
      - if: steps.say.outputs.skip != '1'
        name: Post under the notice
        env:
          TEXT: ${{ steps.say.outputs.text }}
          RELAY: ${{ vars.TEAHOUSE_BOT_RELAY }}
          HOST_KEY: ${{ vars.TEAHOUSE_BOT_HOST_KEY }}
          HOUSE: ${{ vars.TEAHOUSE_BOT_HOUSE }}
          NOTICE: ${{ vars.TEAHOUSE_BOT_NOTICE }}
        run: |
          set -eu
          root="$RUNNER_TEMP/bot"; mkdir -p "$root"
          umask 077; printf '%s\n' "$BOT_DEVICE" > "$root/device"; umask 022
          # the engine knows who it is from device.pub, which is not kept with the key
          ssh-keygen -y -f "$root/device" > "$root/device.pub"
          printf '%s\n' "$HOST_KEY" > "$root/known_hosts"
          th() { target/release/teahouse-client --root "$root" call "$@"; }
          th join "$(jq -nc --arg r "$RELAY" --arg h "$HOUSE" '{relay: $r, house: $h}')" > /dev/null
          out=$(th note "$(jq -nc --arg h "$HOUSE" --arg n "$NOTICE" --arg t "$TEXT" '{house: $h, notice: $n, text: $t}')")
          echo "$out" | jq -c '{ok, commit: .data.commit, error: .error.code}'
          echo "$out" | jq -e '.ok and .data.commit == "pushed"' > /dev/null
