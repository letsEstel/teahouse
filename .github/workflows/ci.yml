# Every push and pull request: format, lints, unit + end-to-end tests, and
# the real-OpenSSH integration test (scripts/sshd-test.sh, no root needed).
name: ci

# CI minutes are paid for: pull requests run the tests once; branches other
# than main are not built again on push (their PR already runs).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 24.04 ships OpenSSH 9.6p1, the version the relay is verified against.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Install sshd
        # The test runs sshd as the unprivileged runner user; installing the
        # package is the only step that needs root.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          /usr/sbin/sshd -V 2>&1 | head -n1 || true

      - name: Real sshd integration test
        run: ./scripts/sshd-test.sh
