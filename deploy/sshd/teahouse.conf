# /etc/ssh/sshd_config.d/teahouse.conf
#
# The relay runs as the unprivileged system user `teahouse`. OpenSSH does
# authentication; teahouse-relay decides authorisation. Member keys are looked
# up live from the teahouses' seating charts, so seat changes take effect on
# the very next connection and no authorized_keys file can go stale.

Match User teahouse
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAcceptedAlgorithms ssh-ed25519
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/lib/teahouse/teahouse-relay --root /var/lib/teahouse authorized-keys --key %k
    AuthorizedKeysCommandUser teahouse
    # Defence in depth; every key line also carries `restrict`.
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    AcceptEnv GIT_PROTOCOL
