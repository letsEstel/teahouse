[package]
name = "teahouse-app"
version = "0.1.0"
description = "Teahouse desktop and Android client: the Tauri shell around app/ (the interface) and client/ (the engine)."
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-only"

# A workspace of its own: the root workspace's CI (fmt, clippy, tests of core/relay/client)
# must not need the system libraries a Tauri build pulls in (webkit2gtk on Linux).
# This crate is built by .github/workflows/app.yml instead.
[workspace]

[lib]
name = "teahouse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The shell. protocol-asset lets the interface show attachments from the engine's
# local blob cache through convertFileSrc (CLIENT-API.md §4, blob).
tauri = { version = "2", features = ["protocol-asset"] }
# Links (a cloud doc, a link in a post) open in the system browser or the right app, not in the window.
tauri-plugin-opener = "2"
serde_json = "1"
# The engine: every command of CLIENT-API.md §4 goes through Client::call.
teahouse-client = { path = "../../client" }

# On Apple platforms libz-sys links the system zlib as a dylib, but the iOS app
# is linked by Xcode from our staticlib and never sees that flag (_crc32
# undefined). Building zlib in makes the staticlib whole.
[target.'cfg(target_os = "ios")'.dependencies]
libz-sys = { version = "1", features = ["static"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
